<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ancillary Results Request • Mlang Good Samaritan Hospital</title>
<style>
:root{--ink:#111;--line:#ddd}*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#ececec;color:#111;padding-bottom:82px}
.app{min-height:100vh;display:flex;justify-content:center;padding:22px}.shell{width:min(1080px,100%);background:#fff;border:1px solid #d8d8d8;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.08);overflow:hidden}
.header{padding:20px 24px 16px;border-bottom:1px solid #e2e2e2;display:flex;justify-content:space-between;gap:18px;align-items:center}.brand{display:flex;gap:14px;align-items:center}.logo{width:54px;height:54px;object-fit:contain}.brand-title{font:700 20px Georgia,"Times New Roman",serif}.brand-sub{font-size:12px;color:#666;margin-top:3px}.account{display:flex;align-items:center;gap:9px;font-size:12px;color:#666}.logout{border:1px solid #d5d5d5;background:#fff;border-radius:8px;padding:8px 10px;font-weight:700}
.body{padding:24px}.title-row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:16px}h1{font:700 26px Georgia,"Times New Roman",serif;margin:0 0 4px}.subtitle{font-size:12px;color:#777;margin:0}.role-note{font-size:10px;color:#888;margin-top:7px}
.primary{border:0;background:#111;color:#fff;border-radius:9px;padding:11px 15px;font-weight:700}.secondary{border:1px solid #d2d2d2;background:#f7f7f7;color:#111;border-radius:9px;padding:10px 13px;font-weight:700}.danger{border:1px solid #e0caca;background:#fff6f6;color:#8a1f1f;border-radius:8px;padding:8px 10px;font-weight:700}
.module-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.module{border:1px solid #ddd;background:#fafafa;border-radius:10px;padding:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}.module.active{background:#111;color:#fff;border-color:#111}
.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:8px;margin-bottom:9px}.search{border:1px solid #cfcfcf;border-radius:9px;padding:11px 12px;outline:0}.search:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,.07)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.filter{border:1px solid #d7d7d7;background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700}.filter.active{background:#111;color:#fff;border-color:#111}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fafafa;border:1px solid #e2e2e2;border-radius:10px;padding:9px 10px;margin-bottom:15px}.datecenter{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}.datecenter button{border:0;background:transparent;font-size:20px;line-height:1;padding:2px 6px}.date-actions{display:flex;gap:5px}.date-actions button{border:1px solid #ddd;background:#fff;border-radius:7px;padding:6px 8px;font-size:10px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.empty{grid-column:1/-1;text-align:center;padding:42px 20px;background:#fafafa;border:1px dashed #ccc;border-radius:10px;color:#777;font-size:13px}
.request-card{position:relative;border:1px solid #ddd;border-radius:14px;padding:14px 15px;min-height:154px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.035);transition:.18s;overflow:hidden}.request-card:hover{border-color:#c7c7c7;box-shadow:0 10px 28px rgba(0,0,0,.075);transform:translateY(-1px)}.request-card.received{outline:2px solid #b8d9c2;outline-offset:-2px}.category{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.07em;border-radius:999px;padding:5px 8px;border:1px solid rgba(0,0,0,.08);margin-bottom:8px}.patient{font:700 19px Georgia,"Times New Roman",serif;line-height:1.15}.meta{font-size:11px;color:#666;margin-top:3px}.specific{font-size:13px;font-weight:600;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-foot{display:flex;justify-content:space-between;gap:8px;align-items:end;margin-top:12px}.status{font-size:10px;font-weight:800;letter-spacing:.06em}.requested{font-size:10px;color:#888}.received-mark{position:absolute;right:13px;top:14px;font-size:9px;font-weight:800;color:#356859;background:#eef8f1;border-radius:999px;padding:5px 7px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-backdrop.show{display:flex}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;border:1px solid #ddd;box-shadow:0 20px 60px rgba(0,0,0,.22)}.modal-head{padding:18px 20px;border-bottom:1px solid #e2e2e2;display:flex;justify-content:space-between;gap:10px;align-items:center}.modal-title{font:700 20px Georgia,"Times New Roman",serif}.close{border:0;background:#eee;border-radius:8px;width:32px;height:32px;font-size:18px}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:700}input,select,textarea{border:1px solid #cfcfcf;border-radius:9px;padding:10px 11px;outline:0;background:#fff}textarea{min-height:92px;resize:vertical;line-height:1.45}input:focus,select:focus,textarea:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,.07)}.modal-foot{padding:14px 20px;border-top:1px solid #e2e2e2;background:#fafafa;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.left-actions,.right-actions{display:flex;gap:7px;flex-wrap:wrap}.note-box{background:#fafafa;border:1px dashed #ccc;border-radius:9px;padding:10px;font-size:11px;color:#666;line-height:1.45;margin-top:13px}
.bottom-nav{position:fixed;z-index:40;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid #ddd;backdrop-filter:blur(12px);display:flex;justify-content:center;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.bottom-inner{width:min(700px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav-btn{border:0;background:transparent;border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#666;font-size:10px;font-weight:700}.nav-icon{font-size:20px;line-height:1}.nav-btn.active{background:#111;color:#fff}
@media(min-width:800px){body{padding-bottom:0}.bottom-nav{position:static;background:transparent;border:0;padding:0 24px 20px;backdrop-filter:none}.bottom-inner{max-width:none;display:flex;justify-content:flex-start;gap:7px}.nav-btn{flex-direction:row;font-size:11px;border:1px solid #ddd;background:#fff;padding:9px 12px}.nav-btn.active{background:#111;border-color:#111}.nav-icon{font-size:16px}}
@media(max-width:760px){.app{padding:0}.shell{border-radius:0;min-height:100vh}.header{padding:16px}.body{padding:18px 15px}.account span{display:none}.cards{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.date-actions button:nth-child(n+3){display:none}.title-row{align-items:center}h1{font-size:23px}}
</style>

<script>
const firebaseConfig={"apiKey": "AIzaSyDaeNQF4qmW0vvwxUPp_NztnT0hoLzm1BQ", "authDomain": "svls-289ee.firebaseapp.com", "databaseURL": "https://svls-289ee-default-rtdb.firebaseio.com", "projectId": "svls-289ee", "storageBucket": "svls-289ee.firebasestorage.app", "messagingSenderId": "500705386198", "appId": "1:500705386198:web:96f189662bc2aa99cf7377", "measurementId": "G-5TNBMQ2HN5"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),auth=firebase.auth();
let currentUser=null,profile=null,requests=[],unsubscribe=null,moduleName='laboratory',statusFilter='all',categoryFilter='all',selectedDate=new Date(),editingId=null;
const LAB=[{key:'clinical_microscopy',label:'Clinical Microscopy',color:'#fff6cc',help:'Specify requested examination, e.g. Urinalysis, Fecalysis, etc.'},{key:'hematology',label:'Hematology',color:'#fbe7e7',help:'Specify the requested hematology examination.'},{key:'clinical_chemistry',label:'Clinical Chemistry',color:'#eaf5e2',help:'Specify the requested chemistry examination.'},{key:'others',label:'Others',color:'#fff',help:'Specify the requested laboratory examination.'}];
const RAD=[{key:'xray',label:'X-Ray',color:'#e7eef8',help:'Specify the body part and requested X-Ray examination.'},{key:'ultrasound',label:'Ultrasound',color:'#eee8f8',help:'Specify the requested ultrasound examination.'}];
const NUR=[{key:'nursing',label:'Nursing Request',color:'#f7f7f7',help:'Specify the nursing-attendant request.'}];
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function listFor(m=moduleName){return m==='laboratory'?LAB:m==='radiology'?RAD:NUR}
function dateText(v){if(!v)return'—';const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'2-digit'})}
function dateTimeText(v){if(!v)return'—';const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleString(undefined,{month:'short',day:'2-digit',hour:'numeric',minute:'2-digit'})}
function dayKey(d){return new Date(d).toISOString().slice(0,10)}function sameDay(v,d){if(!v)return false;const x=v?.toDate?v.toDate():new Date(v);return dayKey(x)===dayKey(d)}
function statusIcon(s){return{pending:'🕐',acknowledged:'🔄',denied:'❌',sent:'📤',received:'✓'}[s]||'•'}
function statusLabel(s){return{pending:'Pending',acknowledged:'Acknowledged / On Process',denied:'Denied / Not Applicable',sent:'Sent / Processed',received:'Received'}[s]||s}
function isRequester(){return !['laboratory','radiology','nursing','admin'].includes(profile?.role)}
function canProcess(){return ['laboratory','radiology','nursing','admin'].includes(profile?.role)||['laboratory','radiology','nursing'].includes(profile?.department)}

auth.onAuthStateChanged(async user=>{
 if(!user){location.href='login.html';return} currentUser=user;
 try{const s=await db.collection('users').doc(user.uid).get();if(!s.exists){await auth.signOut();return}
 profile=s.data();if(profile.approved===false){await auth.signOut();alert('Your account is pending administrator approval.');return}
 $('userName').textContent=profile.fullName||profile.email||user.email;$('roleNote').textContent='Signed in as '+(profile.role||'requester')+(profile.department?' • '+profile.department:'');
 if(profile.role==='laboratory'||profile.department==='laboratory')setModule('laboratory');else if(profile.role==='radiology'||profile.department==='radiology')setModule('radiology');else if(profile.role==='nursing'||profile.department==='nursing')setModule('nursing');
 buildFilters();subscribe();
 }catch(e){console.error(e);alert('Unable to load your user profile.')}
});
async function logout(){if(unsubscribe)unsubscribe();await auth.signOut();location.href='login.html'}
function subscribe(){if(unsubscribe)unsubscribe();unsubscribe=db.collection('ancillaryRequests').orderBy('requestedAt','desc').onSnapshot(s=>{requests=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{$('cards').innerHTML='<div class="empty">Unable to read ancillary requests. Check Firestore rules/indexes.</div>';console.error(e)})}
function visibleRequests(){const q=$('search').value.trim().toLowerCase();return requests.filter(r=>{
 if(r.department!==moduleName)return false;if(!sameDay(r.requestedAt,selectedDate))return false;if(statusFilter!=='all'&&r.status!==statusFilter)return false;if(categoryFilter!=='all'&&r.category!==categoryFilter)return false;
 if(q&&!['patientName','category','specificRequest','status'].some(k=>String(r[k]||'').toLowerCase().includes(q)))return false;return true})}
function render(){ $('dateLabel').textContent=new Date(selectedDate).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});const arr=visibleRequests();if(!arr.length){$('cards').innerHTML='<div class="empty">No requests match the current date, search, or filters.</div>';return}
 $('cards').innerHTML=arr.map(r=>{const cat=listFor(r.department).find(x=>x.key===r.category)||{label:r.category,color:'#fff'};return `<article class="request-card ${r.status==='received'?'received':''}" style="background:${cat.color}" onclick="openRequest('${r.id}')">${r.status==='received'?'<div class="received-mark">✓ RECEIVED</div>':''}<div class="category">${r.department==='laboratory'?'🧪':r.department==='radiology'?'🩻':'👩‍⚕️'} ${esc(cat.label).toUpperCase()}</div><div class="patient">${esc(r.patientName)}</div><div class="meta">${esc(r.age)} / ${esc(r.sex)} • Admitted: ${dateText(r.admissionDate)}</div><div class="specific">${esc(r.specificRequest||'No specific request entered')}</div><div class="card-foot"><div class="status">${statusIcon(r.status)} ${esc(statusLabel(r.status).toUpperCase())}</div><div class="requested">${dateTimeText(r.requestedAt)}</div></div></article>`}).join('')}
function buildFilters(){$('statusFilters').innerHTML=[['all','All'],['pending','Pending'],['acknowledged','Acknowledged'],['denied','Denied'],['sent','Sent'],['received','Received']].map(x=>`<button class="filter ${statusFilter===x[0]?'active':''}" onclick="statusFilter='${x[0]}';buildFilters();render()">${x[1]}</button>`).join('');$('categoryFilters').innerHTML=[['all','All'],...listFor().map(x=>[x.key,x.label])].map(x=>`<button class="filter ${categoryFilter===x[0]?'active':''}" onclick="categoryFilter='${x[0]}';buildFilters();render()">${x[1]}</button>`).join('')}
function setModule(m){moduleName=m;statusFilter='all';categoryFilter='all';const t={laboratory:['Laboratory Requests','Patient details → request → submit'],radiology:['Radiology Requests','Request → Pending → Acknowledged → Sent / Denied → Received'],nursing:['Nursing Attendant Requests','Shared request-card architecture for nursing requests']}[m];$('pageTitle').textContent=t[0];$('pageSubtitle').textContent=t[1];document.querySelectorAll('[data-module]').forEach(x=>x.classList.toggle('active',x.dataset.module===m));buildFilters();render()}
function moveDate(n){selectedDate=new Date(selectedDate);selectedDate.setDate(selectedDate.getDate()+n);render()}
function setQuickDate(k){const n=new Date();if(k==='today')selectedDate=n;if(k==='yesterday'){selectedDate=new Date(n);selectedDate.setDate(n.getDate()-1)}if(k==='month'||k==='week')selectedDate=n;if(k==='week')selectedDate.setDate(n.getDate()-n.getDay());render()}
function pickDate(){const v=prompt('Enter date as YYYY-MM-DD',dayKey(selectedDate));if(/^\d{4}-\d{2}-\d{2}$/.test(v||'')){selectedDate=new Date(v+'T00:00:00');render()}}
function fillCategories(sel=''){ $('fCategory').innerHTML=listFor().map(x=>`<option value="${x.key}" ${x.key===sel?'selected':''}>${x.label}</option>`).join('');$('fCategory').onchange=updateHelp;updateHelp()}
function updateHelp(){const c=listFor().find(x=>x.key===$('fCategory').value);$('categoryHelp').textContent=c?.help||'Specify the request.';$('ancillaryNoteLabel').textContent=moduleName==='laboratory'?'Laboratory Note':moduleName==='radiology'?'Radiology Note':'Nursing Note'}
function clearForm(){['fName','fAge','fSpecific','fRequesterNote','fAncillaryNote'].forEach(id=>$(id).value='');$('fSex').value='';$('fAdmission').value=dayKey(new Date())}
function openNew(){editingId=null;$('modalTitle').textContent='New '+(moduleName==='laboratory'?'Laboratory':moduleName==='radiology'?'Radiology':'Nursing')+' Request';clearForm();$('deleteBtn').style.display='none';fillCategories();updateWorkflow();$('modal').classList.add('show')}
function openRequest(id){const r=requests.find(x=>x.id===id);if(!r)return;editingId=id;$('modalTitle').textContent='Request Details';$('fName').value=r.patientName||'';$('fAge').value=r.age||'';$('fSex').value=r.sex||'';$('fAdmission').value=r.admissionDate||'';$('fSpecific').value=r.specificRequest||'';$('fRequesterNote').value=r.requesterNote||'';$('fAncillaryNote').value=r.ancillaryNote||'';fillCategories(r.category);$('deleteBtn').style.display=isRequester()?'inline-block':'none';updateWorkflow();$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show');editingId=null}
function dataFromForm(){return{patientName:$('fName').value.trim(),age:$('fAge').value.trim(),sex:$('fSex').value,admissionDate:$('fAdmission').value,category:$('fCategory').value,specificRequest:$('fSpecific').value.trim(),requesterNote:$('fRequesterNote').value.trim(),ancillaryNote:$('fAncillaryNote').value.trim()}}
function validate(d){return(!d.patientName||!d.age||!d.sex||!d.admissionDate||!d.category||!d.specificRequest)?'Complete patient details and the specific request.':''}
function updateWorkflow(){const r=editingId?requests.find(x=>x.id===editingId):null;let b='';if(!r)b='<button class="primary" onclick="submitNew()">Submit Request</button>';else if(isRequester()&&['pending','acknowledged','sent'].includes(r.status))b='<button class="primary" onclick="saveEdit()">✏️ Save Changes</button>';if(r&&isRequester()&&r.status==='sent')b+='<button class="primary" onclick="setStatus(\\'received\\')">📥 Mark as Received</button>';if(r&&canProcess()&&r.department===moduleName&&!isRequester()){if(r.status==='pending')b+='<button class="primary" onclick="setStatus(\\'acknowledged\\')">🔄 Acknowledge / On Process</button><button class="danger" onclick="setStatus(\\'denied\\')">❌ Deny</button>';else if(r.status==='acknowledged')b+='<button class="primary" onclick="setStatus(\\'sent\\')">📤 Mark Sent / Processed</button><button class="danger" onclick="setStatus(\\'denied\\')">❌ Deny</button>';b+='<button class="secondary" onclick="saveAncillaryNote()">Save Note</button>'}$('workflowActions').innerHTML=b}
async function submitNew(){const d=dataFromForm(),e=validate(d);if(e)return alert(e);try{await db.collection('ancillaryRequests').add({...d,department:moduleName,status:'pending',requestedAt:firebase.firestore.FieldValue.serverTimestamp(),requestedBy:currentUser.uid,requestedByName:profile.fullName||profile.email,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});closeModal()}catch(x){alert('Unable to submit request: '+x.message)}}
async function saveEdit(){const d=dataFromForm(),e=validate(d);if(e)return alert(e);try{await db.collection('ancillaryRequests').doc(editingId).update({...d,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});closeModal()}catch(x){alert('Unable to save changes: '+x.message)}}
async function saveAncillaryNote(){try{await db.collection('ancillaryRequests').doc(editingId).update({ancillaryNote:$('fAncillaryNote').value.trim(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});closeModal()}catch(x){alert('Unable to save note: '+x.message)}}
async function setStatus(next){const patch={status:next,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};if(next==='acknowledged')patch.acknowledgedAt=firebase.firestore.FieldValue.serverTimestamp();if(next==='sent')patch.sentAt=firebase.firestore.FieldValue.serverTimestamp();if(next==='received')patch.receivedAt=firebase.firestore.FieldValue.serverTimestamp();if(next==='denied')patch.deniedAt=firebase.firestore.FieldValue.serverTimestamp();try{await db.collection('ancillaryRequests').doc(editingId).update(patch);closeModal()}catch(e){alert('Unable to update status: '+e.message)}}
async function deleteCurrent(){if(!editingId)return;const r=requests.find(x=>x.id===editingId);if(!r||!confirm('Delete the request for '+r.patientName+'? This cannot be undone.'))return;try{await db.collection('ancillaryRequests').doc(editingId).delete();closeModal()}catch(e){alert('Unable to delete request: '+e.message)}}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
</script></body></html>
