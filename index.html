#singleRequestMode{display:none}

}

<script>
const firebaseConfig={"apiKey":"AIzaSyDaeNQF4qmW0vvwxUPp_NztnT0hoLzm1BQ","authDomain":"svls-289ee.firebaseapp.com","projectId":"svls-289ee","storageBucket":"svls-289ee.firebasestorage.app","messagingSenderId":"500705386198","appId":"1:500705386198:web:96f189662bc2aa99cf7377","measurementId":"G-5TNBMQ2HN5"};

// Initialize Firebase once and create the Firestore + Auth clients from the same app.
const firebaseApp=firebase.apps.length?firebase.app():firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(firebaseApp);
const auth=firebase.auth(firebaseApp);

// Automatically select the best Firestore transport for the current browser/network.
try{db.settings({experimentalAutoDetectLongPolling:true});}catch(e){console.warn('Firestore transport settings unavailable; using default.',e);}
let currentUser=null,profile=null,requests=[],unsubscribe=null,moduleName='laboratory',statusFilter='all',categoryFilter='all',selectedDate=new Date(),editingId=null,dateMode='month',calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const LAB=[{key:'clinical_microscopy',label:'Clinical Microscopy',color:'#FFF3A8',help:'Specify requested examination, e.g. Urinalysis, Fecalysis, etc.'},{key:'hematology',label:'Hematology',color:'#FAD9D9',help:'Specify the requested hematology examination.'},{key:'clinical_chemistry',label:'Clinical Chemistry',color:'#DFF0D8',help:'Specify the requested chemistry examination.'},{key:'others',label:'Others',color:'#FFFFFF',help:'Specify the requested laboratory examination.'}];
const RAD=[{key:'xray',label:'X-Ray',color:'#e7eef8',help:'Specify the body part and requested X-Ray examination.'},{key:'ultrasound',label:'Ultrasound',color:'#eee8f8',help:'Specify the requested ultrasound examination.'}];
const NUR=[{key:'nursing',label:'Nursing Request',color:'#f7f7f7',help:'Specify the nursing-attendant request.'}];
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function listFor(m=moduleName){return m==='laboratory'?LAB:m==='radiology'?RAD:NUR}
function dateText(v){if(!v)return'—';const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'2-digit'})}
function dateTimeText(v){if(!v)return'—';const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleString(undefined,{month:'short',day:'2-digit',hour:'numeric',minute:'2-digit'})}
function dayKey(d){const x=d instanceof Date?d:new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function sameDay(v,d){if(!v)return false;const x=v?.toDate?v.toDate():new Date(v);return dayKey(x)===dayKey(d)}
function statusIcon(s){return `<span class="status-dot status-${esc(s||'pending')}" aria-hidden="true"></span>`}
function statusLabel(s){return{pending:'Pending',acknowledged:'Acknowledged / On Process',denied:'Denied / Not Applicable',sent:'Sent / Processed',received:'Received'}[s]||s}
function isRequester(){return !['laboratory','radiology','nursing','admin'].includes(profile?.role)}
function canProcess(){return ['laboratory','radiology','nursing','admin'].includes(profile?.role)||['laboratory','radiology','nursing'].includes(profile?.department)}

window.addEventListener('online',()=>{if(db)db.enableNetwork().catch(e=>console.warn('Firestore reconnect failed:',e));});
window.addEventListener('offline',()=>console.warn('Browser is offline; Firestore will use its local cache when available.'));

auth.onAuthStateChanged(async user=>{
 if(!user){$('cards').innerHTML='<div class="empty"><b>No signed-in user.</b><br>Please log in first.</div>';setTimeout(()=>location.href='login.html',700);return;}
 currentUser=user;$('cards').innerHTML='<div class="loading">Connecting to Firestore…</div>';
 try{
  await withTimeout(db.enableNetwork(),'Firestore network initialization',10000);
  const snap=await withTimeout(db.collection('users').doc(user.uid).get(),'Firestore user-profile read',15000);
  if(!snap.exists){await auth.signOut();throw new Error('NO_USER_PROFILE: No user profile was found in Firestore for this signed-in account (users/'+user.uid+').');}
  profile=snap.data()||{};
  if(profile.approved===false){await auth.signOut();throw new Error('ACCOUNT_PENDING: Your account is pending administrator approval.');}
  $('userName').textContent=profile.fullName||profile.email||user.email||'User';
  if(profile.role==='laboratory'||profile.department==='laboratory')setModule('laboratory');else if(profile.role==='radiology'||profile.department==='radiology')setModule('radiology');else if(profile.role==='nursing'||profile.department==='nursing')setModule('nursing');else setModule('all');applyRoleUI();
  applyRoleUI();buildFilters();subscribe();
 }catch(e){console.error('Firebase startup error:',e);$('cards').innerHTML='<div class="empty"><b>Firebase/Firestore could not be connected.</b><br><small>'+esc(e.message||String(e))+'</small><br><br><button class="secondary" onclick="location.reload()">Retry</button></div>';}
});
function withTimeout(promise,label,ms){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out after '+ms+' ms. Check Firestore availability, Firebase Rules, network access, and the browser console.')),ms))]);}
async function logout(){if(unsubscribe)unsubscribe();await auth.signOut();location.href='login.html'}
function subscribe(){
 if(unsubscribe)unsubscribe();$('cards').innerHTML='<div class="loading">Loading requests…</div>';let firstSnapshot=false;
 const timer=setTimeout(()=>{if(!firstSnapshot)$('cards').innerHTML='<div class="empty"><b>Firestore listener did not return data.</b><br><small>Check Firestore Rules and make sure this account can read <b>ancillaryRequests</b>.</small></div>';},10000);
 unsubscribe=db.collection('ancillaryRequests').onSnapshot(s=>{firstSnapshot=true;clearTimeout(timer);requests=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const av=a.requestedAt?.toDate?a.requestedAt.toDate():new Date(a.requestedAt||0);const bv=b.requestedAt?.toDate?b.requestedAt.toDate():new Date(b.requestedAt||0);return bv-av});render();},e=>{firstSnapshot=true;clearTimeout(timer);$('cards').innerHTML='<div class="empty"><b>Unable to read ancillaryRequests.</b><br><small>'+esc(e.message||String(e))+'</small></div>';console.error('ancillaryRequests listener error:',e);});
}

function patientIdentity(r){
  if(r?.patientId)return String(r.patientId);
  return [
    normalizeName(r.patientName),
    String(r.age||'').trim(),
    String(r.sex||'').trim().toLowerCase(),
    String(r.admissionDate||'').trim()
  ].join('|');
}

async function savePatientRequests(){
  if(!isRequester())return alert('Only requester accounts can update requests.');
  const patient={
    patientName:$('fName').value.trim().toUpperCase(),
    age:$('fAge').value.trim(),
    sex:$('fSex').value,
    admissionDate:$('fAdmission').value
  };
  if(!patient.patientName||!patient.age||!patient.sex||!patient.admissionDate)
    return alert('Complete the patient details.');
  const selected=selectedNewRequests();
  if(!selected.length)return alert('Select at least one request.');

  // Keep the original patient identity stable while the editable name/age/sex/admission values change.
  const originalIdentity=window.__openPatientIdentity;
  const originalPatientId=window.__openPatientId;
  const existing=requests.filter(r=>{
    if(originalPatientId)return r.patientId===originalPatientId;
    return (patientIdentity(r)||r.id)===originalIdentity;
  });
  const patientId=originalPatientId||existing.find(r=>r.patientId)?.patientId||`pat_${Date.now()}_${Math.random().toString(36).slice(2,9)}`;
  const selectedKeys=new Set(selected.map(x=>x.department+'|'+x.category));

  try{
    const batch=db.batch();

    existing.forEach(r=>{
      if(!selectedKeys.has(r.department+'|'+r.category)){
        batch.delete(db.collection('ancillaryRequests').doc(r.id));
      }
    });

    selected.forEach(x=>{
      const old=existing.find(r=>r.department===x.department&&r.category===x.category);
      const data={
        ...patient,
        patientId,
        department:x.department,
        category:x.category,
        specificRequest:(x.specificRequest||'').trim().toUpperCase(),
        requesterNote:(x.requesterNote||'').trim().toUpperCase(),
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      };
      if(old){
        batch.update(db.collection('ancillaryRequests').doc(old.id),data);
      }else{
        batch.set(db.collection('ancillaryRequests').doc(),{
          ...data,
          otherNote:'',
          ancillaryNote:'',
          status:'pending',
          requestedAt:firebase.firestore.FieldValue.serverTimestamp(),
          requestedBy:currentUser.uid,
          requestedByName:profile.fullName||profile.email
        });
      }
    });
    await batch.commit();
    closeModal();
  }catch(e){
    alert('Unable to save/update patient requests: '+e.message);
    console.error(e);
  }
}
async function submitNew(){
  const patient={
    patientName:$('fName').value.trim().toUpperCase(),
    age:$('fAge').value.trim(),
    sex:$('fSex').value,
    admissionDate:$('fAdmission').value
  };
  if(!patient.patientName||!patient.age||!patient.sex||!patient.admissionDate)
    return alert('Complete the patient details.');
  const selected=selectedNewRequests();
  if(!selected.length)return alert('Select at least one request.');
  const patientId=`pat_${Date.now()}_${Math.random().toString(36).slice(2,9)}`;
  try{
    const batch=db.batch();
    selected.forEach(x=>{
      const ref=db.collection('ancillaryRequests').doc();
      batch.set(ref,{
        ...patient,
        patientId,
        department:x.department,
        category:x.category,
        specificRequest:(x.specificRequest||'').trim().toUpperCase(),
        requesterNote:(x.requesterNote||'').trim().toUpperCase(),
        otherNote:'',
        ancillaryNote:'',
        status:'pending',
        requestedAt:firebase.firestore.FieldValue.serverTimestamp(),
        requestedBy:currentUser.uid,
        requestedByName:profile.fullName||profile.email,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    await batch.commit();
    closeModal();
  }catch(x){
    alert('Unable to submit requests: '+x.message);
  }
}
async function saveEdit(){
  return alert('Request Details is read-only. Edit the request from the patient card.');
}
async function saveAncillaryNote(){if(isRequester())return alert('Department response notes are read-only for requesters.');try{await db.collection('ancillaryRequests').doc(editingId).update({ancillaryNote:$('sfAncillaryNote').value.trim().toUpperCase(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});closeModal()}catch(x){alert('Unable to save department response note: '+x.message)}}
async function setStatus(next){const allowed=['pending','acknowledged','sent','received','denied'];if(!allowed.includes(next))return;const patch={status:next,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};const ts=firebase.firestore.FieldValue.serverTimestamp();if(next==='acknowledged')patch.acknowledgedAt=ts;if(next==='sent')patch.sentAt=ts;if(next==='received')patch.receivedAt=ts;if(next==='denied')patch.deniedAt=ts;try{await db.collection('ancillaryRequests').doc(editingId).update(patch);closeModal()}catch(e){alert('Unable to update status: '+e.message)}}
async function deleteCurrent(){const target=editingId?requests.find(x=>x.id===editingId):null;const key=target?(patientIdentity(target)||target.id):(window.__openPatientIdentity||null);const pid=target?.patientId||window.__openPatientId||null;if(!key&&!pid)return;if(!confirm('Delete this patient and all associated requests? This cannot be undone.'))return;const matches=requests.filter(x=>pid?x.patientId===pid:(patientIdentity(x)||x.id)===key);if(!matches.length)return;try{const batch=db.batch();matches.forEach(r=>batch.delete(db.collection('ancillaryRequests').doc(r.id)));await batch.commit();closeModal()}catch(e){alert('Unable to delete patient: '+e.message)}}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
</script>

<script id="uppercase-inputs-v7">
(function(){
  function upper(el){
    if(!el)return;
    const type=(el.type||'').toLowerCase();
    if(el.tagName==='TEXTAREA' || (el.tagName==='INPUT' && !['number','date','time','email','password','checkbox','radio','file'].includes(type))){
      el.value=el.value.toUpperCase();
    }
  }
  document.addEventListener('input',function(e){upper(e.target)});
  document.addEventListener('change',function(e){upper(e.target)});
  document.addEventListener('focusin',function(e){upper(e.target)});
  document.addEventListener('DOMContentLoaded',function(){
    document.querySelectorAll('input,textarea').forEach(upper);
  });
})();
</script>
